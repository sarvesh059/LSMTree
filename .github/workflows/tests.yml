name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor the pom declares (maven.compiler.release=22); 24 is what
        # development currently runs on. release=22 already stops javac accepting a
        # newer API, so the matrix is here to catch runtime differences.
        java: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # verify rather than test: it also runs package, which README documents.
      # Benchmarks are excluded by the Surefire config, so they cannot run here.
      - run: mvn -B --no-transfer-progress verify
